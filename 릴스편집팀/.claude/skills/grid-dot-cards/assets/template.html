<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>grid-dot-cards</title>
<style>
/* ══ grid-dot-cards — 모눈종이 + 파스텔 오로라 + 도트 폰트 카드 ══
   폰트: Neo둥근모(NeoDunggeunmo) · SIL OFL 1.1 · fonts/OFL.txt 참고 */
@font-face{font-family:'Dot';src:url('fonts/NeoDunggeunmo.ttf') format('truetype')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#FFF}
body{font-family:'Dot',monospace;color:#0A0A08}

:root{
  --ink:#0A0A08;              /* 잉크(순검정 아님) */
  --paper:#FFFFFF;
  --line1:rgba(0,0,0,.055);   /* 가는 격자 15px */
  --line2:rgba(0,0,0,.10);    /* 굵은 격자 75px */
  --sage:#B9CCAE;
  --blue:#78A6FB;
  --pink:#E9C4D6;             /* 블러 뒤 보조색으로만 */
  --mute:#8A8A88;
  /* 크기 단위 — half(1080x960)=1, full(1080x1920)=1.22 */
  --k:1;
}
body.full{--k:1.22}

#cam{position:absolute;inset:0;transform-origin:50% 50%}
#stage{position:relative;width:100%;height:100%;overflow:hidden;background:var(--paper);perspective:1600px}

/* 모눈종이 2단계 격자 — 줌 들어가도 가장자리 안 보이게 화면보다 크게 */
.grid{position:absolute;left:-8%;top:-8%;width:116%;height:116%;
  background-image:
    linear-gradient(var(--line2) 1.5px, transparent 1.5px),
    linear-gradient(90deg, var(--line2) 1.5px, transparent 1.5px),
    linear-gradient(var(--line1) 1px, transparent 1px),
    linear-gradient(90deg, var(--line1) 1px, transparent 1px);
  background-size:75px 75px, 75px 75px, 15px 15px, 15px 15px;
}
/* 파스텔 오로라 */
.aura{position:absolute;inset:-20%;filter:blur(90px);opacity:.55}
.aura i{position:absolute;border-radius:50%;display:block}

/* UI 4종 */
.dot{font-family:'Dot',monospace;letter-spacing:.06em;text-transform:uppercase}
.pill{display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;
  background:var(--ink);color:#fff;border-radius:999px;padding:.18em .62em}
.pill-o{display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;
  border:3px solid var(--ink);border-radius:999px;padding:.14em .58em}
.circle{display:inline-flex;align-items:center;justify-content:center;flex:none;
  background:var(--ink);color:#fff;border-radius:50%;width:1.5em;height:1.5em}
.card{background:#fff;border-radius:26px;box-shadow:0 18px 50px rgba(0,0,0,.10)}

/* 레이아웃 */
#head{position:absolute;left:0;right:0;top:calc(64px*var(--k));display:flex;justify-content:center;
  align-items:center;gap:14px;font-size:calc(34px*var(--k))}
#head .pips{display:flex;gap:10px;align-items:center}
#head .pips b{display:block;width:.42em;height:.42em;border-radius:50%;border:3px solid var(--ink)}
#head .pips b.on{background:var(--ink)}
body.full #head{top:300px}

.scene{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:calc(36px*var(--k));padding:calc(60px*var(--k)) 70px 0}
.scene .card{width:100%;padding:calc(46px*var(--k)) calc(46px*var(--k));transform-style:preserve-3d}
.scene .step{font-size:calc(30px*var(--k));color:var(--mute);margin-bottom:calc(16px*var(--k))}
.scene .title{font-size:calc(74px*var(--k));line-height:1.18;word-break:keep-all}
.scene .pills{display:flex;flex-wrap:wrap;gap:12px;margin-top:calc(28px*var(--k))}
.scene .pills span{font-size:calc(32px*var(--k));will-change:transform}
.scene .foot{font-size:calc(34px*var(--k));display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
.scene .foot .pill{font-size:calc(30px*var(--k))}
.scene .foot .arrow{width:1.9em;height:1.9em;padding:0}
</style>
</head>
<body>
<div id="cam"><div id="stage">
  <div class="grid"></div>
  <div class="aura">
    <i id="a1" style="left:-5%;top:5%;width:62%;height:42%;background:var(--sage)"></i>
    <i id="a2" style="right:-8%;top:28%;width:58%;height:40%;background:var(--blue)"></i>
    <i id="a3" style="left:12%;bottom:-6%;width:66%;height:38%;background:var(--pink)"></i>
  </div>
  <div id="head" class="dot"></div>
  <div id="scenes"></div>
</div></div>

<script>
/* ── 장면 데이터 ──
   render.mjs 가 window.__DECK 에 넣어준다. 브라우저로 직접 열면 아래 예시가 나온다.
   형식: { "label":"선택", "scenes":[{start,end,step,title,pills,footer}] }  (배열만 줘도 됨)
   - title: 두 줄까지. 줄바꿈은 \n. 길면 자동으로 글자가 작아진다
   - pills: 앞에서부터 채운 알약, 마지막 하나는 테두리 알약. "o:글자" 로 쓰면 강제로 테두리 알약
   - footer: [대괄호] 는 검정 알약, → 는 원형 화살표 배지 */
const DEMO = { label: "", scenes: [
  { start: 0, end: 2, step: "STEP 01", title: "말로 찍은 영상\n그대로 넣기", pills: ["무음컷", "자막", "효과음"], footer: "[클로드코드]가 편집합니다 →" },
  { start: 2, end: 4, step: "STEP 02", title: "문장마다\n카드가 바뀐다", pills: ["자동", "도트", "o:모눈종이"], footer: "위 절반은 카드" },
  { start: 4, end: 6, step: "STEP 03", title: "아래는 얼굴\n완성본 mp4", pills: ["1080x1920", "o:한 번에"], footer: "[편집해줘] 한 마디 →" },
]};
const raw = window.__DECK || DEMO;
const DECK = Array.isArray(raw) ? { scenes: raw } : raw;
const SC = DECK.scenes.map(s => ({ ...s, start: +s.start, end: +s.end }));

const isFull = (window.__SIZE || (innerHeight > innerWidth * 1.4 ? 'full' : 'half')) === 'full';
document.body.classList.toggle('full', isFull);

const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

/* 머리줄: 장면 번호 원형 배지 + 진행 점 + (선택) 라벨 */
const head = document.getElementById('head');
const num = el('span', 'circle'); head.appendChild(num);
const pips = el('span', 'pips'); SC.forEach(() => pips.appendChild(el('b'))); head.appendChild(pips);
if (DECK.label) head.appendChild(el('span', 'pill-o', DECK.label));
if (SC.length < 2) pips.style.display = 'none';

/* 장면 DOM */
const host = document.getElementById('scenes');
const nodes = SC.map(s => {
  const root = el('div', 'scene dot');
  const card = el('div', 'card');
  if (s.step) card.appendChild(el('div', 'step', s.step));
  const title = el('div', 'title');
  String(s.title || '').split('\n').forEach((ln, i) => { if (i) title.appendChild(document.createElement('br')); title.appendChild(document.createTextNode(ln)); });
  card.appendChild(title);
  const pillBox = el('div', 'pills');
  const list = (s.pills || []).slice(0, 4);
  const pills = list.map((p, i) => {
    let txt = String(p), outline = i === list.length - 1 && list.length > 1;
    if (txt.startsWith('o:')) { txt = txt.slice(2); outline = true; }
    const sp = el('span', outline ? 'pill-o' : 'pill', txt); pillBox.appendChild(sp); return sp;
  });
  if (pills.length) card.appendChild(pillBox);
  root.appendChild(card);
  let foot = null;
  if (s.footer) {
    foot = el('div', 'foot');
    String(s.footer).split(/(\[[^\]]+\]|→)/).filter(Boolean).forEach(tok => {
      if (tok === '→') foot.appendChild(el('span', 'pill arrow', '→'));
      else if (tok.startsWith('[')) foot.appendChild(el('span', 'pill', tok.slice(1, -1)));
      else if (tok.trim()) foot.appendChild(el('span', '', tok.trim()));
    });
    root.appendChild(foot);
  }
  host.appendChild(root);
  return { root, card, title, pills, foot };
});

/* 제목이 두 줄을 넘으면 글자 크기를 줄인다 */
function fitTitles() {
  nodes.forEach(n => {
    n.root.style.display = 'flex';
    let size = parseFloat(getComputedStyle(n.title).fontSize);
    const lh = 1.18, maxLines = 2.3;
    while (size > 34 && n.title.scrollHeight > size * lh * maxLines) { size -= 2; n.title.style.fontSize = size + 'px'; }
    while (size > 34 && n.title.scrollWidth > n.title.clientWidth + 1) { size -= 2; n.title.style.fontSize = size + 'px'; }
    n.root.style.display = 'none';
  });
}

/* 이징 */
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eo = p => 1 - Math.pow(1 - p, 3);
const eio = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const spring = p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p) * Math.cos(p * Math.PI * 3.2); // 튕기는 알약
const mix = (a, b, p) => a + (b - a) * p;

const CAM = document.getElementById('cam');
const a1 = document.getElementById('a1'), a2 = document.getElementById('a2'), a3 = document.getElementById('a3');
const EXIT = 0.16;   // 이전 카드 퇴장 시간
const LEAD = 0.12;   // 새 카드는 이전 카드가 거의 빠진 뒤 들어온다 (글자 겹침 방지)

window.setTime = t => {
  // 오로라 — 천천히 흐른다
  a1.style.transform = `translate(${Math.sin(t * .7) * 70}px, ${Math.cos(t * .5) * 50}px)`;
  a2.style.transform = `translate(${Math.cos(t * .6) * 80}px, ${Math.sin(t * .8) * 46}px)`;
  a3.style.transform = `translate(${Math.sin(t * .9 + 2) * 60}px, ${Math.cos(t * .7) * 40}px)`;

  // 카메라 — 시작할 때 한 번 1.06 → 1.0
  CAM.style.transform = `scale(${mix(1.06, 1.0, eio(seg(t, 0, 1.5)))})`;

  // 현재 장면
  let cur = 0;
  SC.forEach((s, i) => { if (t >= s.start) cur = i; });
  const cs = SC[cur];

  // 머리줄
  num.textContent = String(cur + 1).padStart(2, '0');
  const pn = spring(seg(t - cs.start, 0, .6));
  num.style.transform = `scale(${mix(.6, 1, pn)})`;
  [...pips.children].forEach((b, i) => b.classList.toggle('on', i <= cur));
  const ph = eo(seg(t, 0, .45));
  head.style.opacity = ph; head.style.transform = `translateY(${mix(-22, 0, ph)}px)`;

  SC.forEach((s, i) => {
    const n = nodes[i];
    const isLast = i === SC.length - 1;
    const visible = t >= s.start && (isLast || t < s.end + EXIT);
    n.root.style.display = visible ? 'flex' : 'none';
    if (!visible) return;
    const dur = Math.max(.6, s.end - s.start);
    const f = clamp(dur / 1.8, .45, 1);          // 짧은 장면은 진입을 압축
    const lt = (t - s.start - (i ? LEAD : 0)) / f;

    // 퇴장 (다음 카드보다 먼저 0.16초 동안 빠진다)
    const ex = isLast ? 0 : eo(seg(t, s.end, s.end + EXIT));

    // 카드 rotateY 진입
    const p1 = eo(seg(lt, 0, .7));
    n.card.style.opacity = clamp(seg(lt, .02, .27)) * (1 - ex);
    n.card.style.transform = `translateX(${mix(0, -60, ex)}px) rotateY(${mix(-30, 0, p1) + ex * 24}deg) rotateX(${mix(10, 0, p1)}deg) scale(${mix(.9, 1, p1) * mix(1, .96, ex)})`;
    n.card.style.boxShadow = `0 ${mix(56, 18, p1)}px ${mix(70, 50, p1)}px rgba(0,0,0,${mix(.28, .10, p1)})`;

    // 알약 — 스프링으로 튕기며 0.13초씩 시차
    n.pills.forEach((sp, k) => {
      const a = .5 + k * .13;
      sp.style.opacity = clamp(seg(lt, a, a + .2));
      sp.style.transform = `scale(${mix(.5, 1, spring(seg(lt, a, a + .75)))})`;
    });

    // 하단 줄
    if (n.foot) {
      const p2 = eo(seg(lt, 1.1, 1.55));
      n.foot.style.opacity = p2 * (1 - ex);
      n.foot.style.transform = `translateY(${mix(20, 0, p2)}px)`;
    }
  });
};

// 폰트를 명시적으로 불러온 뒤 크기 맞춤 (fonts.ready 만 기다리면 대체 폰트로 재는 일이 생김)
Promise.all([document.fonts.load("74px 'Dot'", '가A1'), document.fonts.ready]).then(() => { fitTitles(); window.setTime(0); setTimeout(() => { window.__ready = true; }, 150); });
</script>
</body>
</html>
